<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Macau by SHY17</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<h2>DATA MACAU 2025 - 2026</h2>
// <p class="info">2025 - 2026</p> //
<div id="jamRealTime" class="jam-macau"></div>
<div class="pencarian-wrap">
  <div class="pencarian-box">
    <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="Cari angka Result atau Tanggal" aria-label="Cari angka result atau tanggal">
    <button id="btnClearSearch" type="button" aria-label="Hapus pencarian" hidden>×</button>
  </div>
  <div id="infoHasilCari" class="hasil-cari" role="status" aria-live="polite" hidden></div>
</div>
<div id="statusData" role="status" style="text-align:center;font-size:13px;color:#555;padding:6px 4px"></div>
<table id="tabelku">
<thead><tr><th>Tanggal</th><th>00:00</th><th>13:00</th><th>16:00</th><th>19:00</th><th>22:00</th><th>23:00</th></tr></thead>
<tbody>
<tr><td colspan="7">Memuat data Google Sheets...</td></tr>
</tbody>
</table>

<button id="btnTop" onclick="keAtas()">
  <span class="panah">^</span>
  <span class="teks">TOP</span>
</button>

<script>
  function keAtas(){ window.scrollTo({top:0, behavior:'smooth'}); }
</script>

<footer>
  <div class="garis"></div>
  <div class="brand">DATA MACAU BY SHY17</div>
  <div class="copy">© 2025 - 2026 • All Rights Reserved</div>
</footer>
  
<script src="script.js?v=2" defer></script>
<script>
// JAM REAL TIME - MACAU - LANGSUNG DI HTML BIAR JALAN
function updateJamMacau() {
  const el = document.getElementById('jamRealTime');
  if (!el) return;
  const now = new Date();
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const namaHari = hari[now.getDay()];
  const tgl = String(now.getDate()).padStart(2, '0');
  const namaBulan = bulan[now.getMonth()];
  const tahun = now.getFullYear();
  const jam = String(now.getHours()).padStart(2, '0');
  const menit = String(now.getMinutes()).padStart(2, '0');
  const detik = String(now.getSeconds()).padStart(2, '0');
  el.textContent = `${namaHari} - ${tgl} ${namaBulan} ${tahun} - ${jam}:${menit}:${detik}`;
}
updateJamMacau();
setInterval(updateJamMacau, 1000);
</script>
</body>
</body>
</html>
