<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tanggal dan Jam WIB</title>
</head>
<body>
  <span id="tanggal-jam"></span>

  <script>
    const tampilanWaktu = document.getElementById("tanggal-jam");

    const formatWaktu = new Intl.DateTimeFormat("id-ID", {
      timeZone: "Asia/Jakarta",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    });

    function perbaruiWaktu() {
      const bagian = Object.fromEntries(
        formatWaktu.formatToParts(new Date()).map(({ type, value }) => [type, value])
      );

      tampilanWaktu.textContent =
        `${bagian.day}/${bagian.month}/${bagian.year} - ${bagian.hour}:${bagian.minute}`;
    }

    perbaruiWaktu();
    setInterval(perbaruiWaktu, 1000);
  </script>
</body>
</html>
