<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBUG API</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:15px}pre{background:#000;color:#0f0;padding:10px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}button{background:#ffcc00;border:0;padding:10px 20px;font-weight:bold;border-radius:8px}</style>
</head>
<body>
<h2>🔍 DEBUG API - LIAT ISI ASLINYA</h2>
<button onclick="loadData()">CEK API SEKARANG</button>
<p id="status">Belum dicek...</p>
<h3>Isi Mentah Yang Dikasih Google:</h3>
<pre id="mentah">Belum ada...</pre>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPXooZknLI43LEmDOWsna2jjrQbmFq7cGqP2BuUxysC0QWCc8cjB2pNmHshDbfGd_s/exec";

async function sedot() {
  document.getElementById("status").innerText = "Lagi nyedot...";
  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    document.getElementById("status").innerText = "Berhasil! Total: " + json.total;
    document.getElementById("raw").innerText = JSON.stringify(json, null, 2);

    // Tampilin ke tabel
    let html = "";
    json.data.forEach(function(d){
      html += `<tr>
        <td>${d.pasaran}</td>
        <td><b style="font-size:20px">${d.angka}</b></td>
        <td>${d.tanggal}</td>
      </tr>`;
    });
    document.getElementById("tbody").innerHTML = html;

  } catch(e) {
    document.getElementById("status").innerText = "Gagal: " + e;
  }
}
</script>

<button onclick="sedot()">SEDOT SEKARANG</button>
<p id="status">Belum disedot</p>
<table border="1" width="100%">
  <thead><tr><th>Pasaran</th><th>Angka</th><th>Tanggal</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>
<pre id="raw"></pre>
