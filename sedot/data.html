<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tanggal dan Jam WIB</title>
</head>
<body>
  <time id="tanggal-jam"></time>

  <script>
    const tampilanWaktu = document.getElementById("tanggal-jam");

    const formatWaktu = new Intl.DateTimeFormat("id-ID", {
      timeZone: "Asia/Jakarta",
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    function perbaruiWaktu() {
      const sekarang = new Date();
      const { weekday, day, month, year, hour, minute, second } =
        Object.fromEntries(
          formatWaktu.formatToParts(sekarang).map(({ type, value }) => [type, value])
        );

      tampilanWaktu.textContent =
        `${weekday}, ${day}/${month}/${year} - ${hour}:${minute}:${second}`;
      tampilanWaktu.dateTime = sekarang.toISOString();
    }

    perbaruiWaktu();
    setInterval(perbaruiWaktu, 1000);
  </script>
</body>
</html>
