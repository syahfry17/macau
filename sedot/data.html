<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBUG API</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:15px}pre{background:#000;color:#0f0;padding:10px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}button{background:#ffcc00;border:0;padding:10px 20px;font-weight:bold;border-radius:8px}</style>
</head>
<body>
<h2>🔍 DEBUG API - LIAT ISI ASLINYA</h2>
<button onclick="loadData()">CEK API SEKARANG</button>
<p id="status">Belum dicek...</p>
<h3>Isi Mentah Yang Dikasih Google:</h3>
<pre id="mentah">Belum ada...</pre>
<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzPXooZknLI43LEmDOWsna2jjrQbmFq7cGqP2BuUxysC0QWCc8cjB2pNmHshDbfGd_s/exec";
function loadData(){
  document.getElementById("status").innerText = "Lagi ngecek...";
  fetch(API_URL)
    .then(r => r.text())
    .then(t => {
      document.getElementById("status").innerText = "Dapet! Panjang: " + t.length + " karakter";
      document.getElementById("mentah").innerText = t.substring(0, 2000);
    })
    .catch(e => {
      document.getElementById("status").innerText = "Gagal total: " + e;
    });
}
loadData();
</script>
</body>
</html>
